<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Умный Дом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0a0a0f;
  color: #e0e0f0;
  font-size: 14px;
  min-height: 100vh;
  padding-bottom: 24px;
  -webkit-font-smoothing: antialiased;
}

/* Loading screen */
#loading {
  position: fixed;
  inset: 0;
  background: #0a0a0f;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  z-index: 1000;
  transition: opacity 0.4s ease;
}
#loading.fade-out { opacity: 0; pointer-events: none; }

.spinner {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid rgba(99,102,241,0.2);
  border-top-color: #6366f1;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#loading p {
  color: #6060a0;
  font-size: 13px;
  font-weight: 500;
}

/* App */
#app {
  max-width: 600px;
  margin: 0 auto;
  padding: 12px 12px 0;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 4px 16px;
}
.app-header h1 {
  font-size: 18px;
  font-weight: 700;
  color: #e0e0f0;
}
.last-updated {
  font-size: 11px;
  color: #4040608;
  color: #50508a;
}

/* Sections */
.section {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-size: 14px;
  font-weight: 600;
  color: #c0c0e0;
  transition: background 0.15s;
}
.section-header:active { background: rgba(255,255,255,0.05); }

.chevron {
  font-size: 12px;
  color: #6060a0;
  transition: transform 0.3s ease;
}

.section-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.section-body.open { max-height: 900px; }

.section-content {
  padding: 4px 16px 16px;
}

/* Status grid */
.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 12px 14px;
}
.stat-label {
  font-size: 11px;
  color: #60608a;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: #e0e0f0;
  line-height: 1.1;
}
.stat-unit {
  font-size: 12px;
  color: #6060a0;
  font-weight: 500;
}
.stat-sub {
  font-size: 11px;
  color: #60608a;
  margin-top: 3px;
}

/* Family list */
.family-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.family-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
}
.family-name {
  font-size: 14px;
  font-weight: 500;
  color: #c0c0e0;
}
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.badge-home { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.badge-away { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
.badge-unknown { background: rgba(255,255,255,0.07); color: #70708a; border: 1px solid rgba(255,255,255,0.1); }

/* Lights grid */
.lights-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.light-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 8px;
  border-radius: 12px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  line-height: 1.2;
  background: none;
}
.light-btn .light-icon { font-size: 20px; }
.light-btn.on {
  background: rgba(234,179,8,0.15);
  border-color: rgba(234,179,8,0.6);
  color: #eab308;
  box-shadow: 0 0 12px rgba(234,179,8,0.2);
}
.light-btn.off {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.1);
  color: #555570;
}
.light-btn:active { transform: scale(0.94); }
.light-btn.pending { opacity: 0.5; pointer-events: none; }

/* Climate section */
.climate-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.clim-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.clim-icon { font-size: 18px; margin-bottom: 4px; }
.clim-val { font-size: 16px; font-weight: 700; color: #e0e0f0; }
.clim-label { font-size: 10px; color: #60608a; margin-top: 2px; }

.climate-controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px;
}

/* TV section */
.tv-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 12px;
}
.tv-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #555570;
  flex-shrink: 0;
}
.tv-dot.on { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.5); }
.tv-status-text { font-size: 13px; color: #a0a0c0; }
.tv-title { font-size: 12px; color: #70708a; margin-top: 2px; }

.tv-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.tv-media {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

/* Vacuum section */
.vacuum-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 12px;
}
.vacuum-controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

/* Prayers section */
.prayers-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.prayer-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.2s;
}
.prayer-item.next {
  background: rgba(99,102,241,0.15);
  border-color: rgba(99,102,241,0.4);
  box-shadow: 0 0 16px rgba(99,102,241,0.15);
}
.prayer-item.past { opacity: 0.5; }
.prayer-left { display: flex; align-items: center; gap: 10px; }
.prayer-icon { font-size: 15px; width: 20px; text-align: center; }
.prayer-name { font-size: 14px; font-weight: 500; color: #c0c0e0; }
.prayer-item.next .prayer-name { color: #a0a0ff; font-weight: 600; }
.prayer-time { font-size: 14px; font-weight: 600; color: #e0e0f0; }
.prayer-item.next .prayer-time { color: #a0a0ff; }

/* Buttons */
.btn {
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-family: inherit;
  white-space: nowrap;
}
.btn-primary { background: #6366f1; color: white; }
.btn-success { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.btn-danger  { background: rgba(239,68,68,0.2);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
.btn-neutral { background: rgba(255,255,255,0.07); color: #a0a0b8; border: 1px solid rgba(255,255,255,0.1); }
.btn-warning { background: rgba(234,179,8,0.2); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
.btn:active  { transform: scale(0.94); filter: brightness(1.2); }
.btn.pending { opacity: 0.5; pointer-events: none; }

/* Toast */
#toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  width: 90%;
  max-width: 340px;
}
.toast {
  background: rgba(30,30,50,0.95);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: #e0e0f0;
  backdrop-filter: blur(12px);
  animation: toast-in 0.25s ease forwards;
  text-align: center;
  width: 100%;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes toast-out {
  from { opacity: 1; }
  to   { opacity: 0; }
}

.divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 10px 0;
}

/* Family map link */
.map-link {
  font-size: 18px;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(99,102,241,0.15);
  border: 1px solid rgba(99,102,241,0.3);
  transition: background 0.15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.map-link:active { background: rgba(99,102,241,0.35); }
.map-link-off {
  opacity: 0.25;
  pointer-events: none;
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.1);
}
</style>
</head>

<!-- Main app -->

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────────────────
const API_TOKEN = 'eb4512bc794be98c665881d28c5c511c';
const API_BASE  = '/ha-app/api';

const LIGHTS_MAP = {
  'light.svet_krovat':            '🛏️ Кровать',
  'switch.vykliuchatel_kukhnia':  '🍳 Кухня',
  'switch.kabinet_svet_pk_left':  '🖥️ ПК Лев',
  'switch.kabinet_svet_pk_right': '🖥️ ПК Пр',
  'switch.sonoff_100093f84f':     '💡 Люстра',
  'switch.sonoff_1000a60930':     '🚪 Шкаф',
};

const LIGHTS_DOMAIN = {
  'light.svet_krovat':            'light',
  'switch.vykliuchatel_kukhnia':  'switch',
  'switch.kabinet_svet_pk_left':  'switch',
  'switch.kabinet_svet_pk_right': 'switch',
  'switch.sonoff_100093f84f':     'switch',
  'switch.sonoff_1000a60930':     'switch',
};

const TV_ENTITY = 'media_player.android_tv';
const FLOOR_ENTITY = 'climate.teplyi_pol_lodzhiia';
const VACUUM_ENTITY = 'vacuum.pylik';

// ── State ──────────────────────────────────────────────────────────────────
let lastStatus = null;
let tvMuted = false;
let currentSetpoint = null;

// ── Telegram SDK init ──────────────────────────────────────────────────────
if (window.Telegram && window.Telegram.WebApp) {
  try { Telegram.WebApp.expand(); } catch(e) {}
}

// ── Collapsible sections ───────────────────────────────────────────────────
function toggleSection(id) {
  const body = document.getElementById(id);
  if (!body) return;
  const header = body.previousElementSibling;
  const icon = header ? header.querySelector('.chevron') : null;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  if (icon) icon.textContent = isOpen ? '▾' : '▴';
}

// ── API ────────────────────────────────────────────────────────────────────
async function api(path, method = 'GET', body = null) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 15000);
  try {
    const opts = {
      method,
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_TOKEN,
      },
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(tid);
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, duration = 2800) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toast-out 0.3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

// ── Loading ────────────────────────────────────────────────────────────────
let loadingHidden = false;
function hideLoading() {
  if (loadingHidden) return;
  loadingHidden = true;
  const el = document.getElementById('loading');
  el.classList.add('fade-out');
  setTimeout(() => { el.style.display = 'none'; }, 450);
}

// ── Apply status ───────────────────────────────────────────────────────────
function applyStatus(d) {
  lastStatus = d;

  // --- Status section ---
  const powerEl = document.getElementById('stat-power');
  if (d.power != null) {
    const w = parseFloat(d.power);
    powerEl.innerHTML = '<span>' + Math.round(w) + '</span><span class="stat-unit"> Вт</span>';
  }

  const tempEl = document.getElementById('stat-temp');
  if (d.temp_detskaia != null) {
    tempEl.innerHTML = '<span>' + parseFloat(d.temp_detskaia).toFixed(1) + '</span><span class="stat-unit"> °C</span>';
  }

  const inetEl = document.getElementById('stat-internet');
  if (d.internet != null) {
    inetEl.textContent = d.internet === 'on' ? '🟢' : '🔴';
  }

  const floorEl = document.getElementById('stat-floor');
  const floorSubEl = document.getElementById('stat-floor-sub');
  if (d.floor_heating != null) {
    const isHeating = d.floor_heating === 'heat';
    floorEl.textContent = isHeating ? '🔥 Греет' : '❄️ Выкл';
    floorEl.style.color = isHeating ? '#ef4444' : '#3b82f6';
  }
  if (d.floor_temp != null && d.floor_setpoint != null) {
    floorSubEl.textContent = parseFloat(d.floor_temp).toFixed(1) + '° / ' + parseFloat(d.floor_setpoint).toFixed(0) + '° уст';
  }

  // --- Family section ---
  const familyEl = document.getElementById('family-list');
  if (d.family && Object.keys(d.family).length > 0) {
    familyEl.innerHTML = Object.entries(d.family).map(([name, info]) => {
      // info может быть объектом {state, lat, lon} или строкой (старый формат)
      const state = (typeof info === 'object') ? info.state : info;
      const lat   = (typeof info === 'object') ? info.lat   : null;
      const lon   = (typeof info === 'object') ? info.lon   : null;

      let cls = 'badge-unknown', label = '—';
      if (state === 'home')          { cls = 'badge-home'; label = '🏠 Дома'; }
      else if (state === 'not_home') { cls = 'badge-away'; label = '🚗 Нет'; }
      else                           { label = '❓'; }

      const mapUrl = (lat && lon) ? `https://www.google.com/maps?q=${lat},${lon}` : null;
      const mapBtn = mapUrl
        ? `<a href="${mapUrl}" target="_blank" rel="noopener" class="map-link" title="Открыть на карте">📍</a>`
        : `<span class="map-link map-link-off" title="Нет координат">📍</span>`;

      return `<div class="family-item">
        <span class="family-name">${escapeHtml(name)}</span>
        <span class="badge ${cls}">${label}</span>
        ${mapBtn}
      </div>`;
    }).join('');
  } else {
    familyEl.innerHTML = '<div style="color:#60608a;font-size:13px;text-align:center;padding:8px">Нет данных</div>';
  }

  // --- Lights section ---
  const lightsEl = document.getElementById('lights-grid');
  if (d.lights && Object.keys(d.lights).length > 0) {
    lightsEl.innerHTML = Object.entries(d.lights).map(([entity, state]) => {
      const label = LIGHTS_MAP[entity] || entity;
      const isOn = state === 'on';
      const parts = label.match(/^(\S+)\s(.+)$/);
      const icon = parts ? parts[1] : '💡';
      const name = parts ? parts[2] : label;
      return `<button class="light-btn ${isOn ? 'on' : 'off'}"
        onclick="toggleLight('${escapeAttr(entity)}')"
        id="light-${sanitizeId(entity)}">
        <span class="light-icon">${icon}</span>
        <span>${escapeHtml(name)}</span>
      </button>`;
    }).join('');
  } else {
    lightsEl.innerHTML = '<div style="color:#60608a;font-size:13px;text-align:center;padding:8px;grid-column:span 3">Нет данных</div>';
  }

  // --- Climate section ---
  if (d.temp_detskaia != null) {
    document.getElementById('clim-temp').textContent = parseFloat(d.temp_detskaia).toFixed(1);
  }
  if (d.humidity != null) {
    document.getElementById('clim-humid').textContent = d.humidity;
  } else {
    document.getElementById('clim-humid').textContent = '—';
  }
  if (d.floor_temp != null) {
    document.getElementById('clim-floor').textContent = parseFloat(d.floor_temp).toFixed(1);
  }
  if (d.floor_setpoint != null) {
    currentSetpoint = parseFloat(d.floor_setpoint);
    document.getElementById('clim-setpoint').textContent = currentSetpoint.toFixed(0) + ' °C';
  }

  // --- TV section ---
  if (d.tv) {
    const tv = d.tv;
    const dot = document.getElementById('tv-dot');
    const statusText = document.getElementById('tv-status-text');
    const titleEl = document.getElementById('tv-title');
    const muteBtn = document.getElementById('tv-mute-btn');

    const stateMap = {
      'on': 'Включён', 'off': 'Выключен', 'idle': 'Ожидание',
      'paused': 'Пауза', 'playing': 'Воспроизводит', 'standby': 'Standby',
      'unavailable': 'Недоступен', 'unknown': 'Неизвестно',
    };
    const isOn = tv.state === 'on' || tv.state === 'playing' || tv.state === 'paused' || tv.state === 'idle';
    dot.className = 'tv-dot' + (isOn ? ' on' : '');
    statusText.textContent = stateMap[tv.state] || tv.state;
    titleEl.textContent = tv.title ? tv.title : '';
    tvMuted = tv.muted || false;
    muteBtn.textContent = tvMuted ? '🔇 Включить звук' : '🔇 Mute';
    if (tvMuted) {
      muteBtn.classList.add('btn-warning');
      muteBtn.classList.remove('btn-neutral');
    } else {
      muteBtn.classList.remove('btn-warning');
      muteBtn.classList.add('btn-neutral');
    }
  }

  // --- Vacuum section ---
  if (d.vacuum) {
    const stateMap = {
      'docked': '🏠 На базе', 'idle': '💤 Ожидание', 'cleaning': '🧹 Уборка',
      'paused': '⏸ Пауза', 'returning': '↩️ Возврат', 'error': '❌ Ошибка',
      'unavailable': '❓ Недоступен', 'unknown': '❓ Неизвестно',
    };
    const st = d.vacuum.state || 'unknown';
    document.getElementById('vacuum-status-text').textContent = stateMap[st] || st;
  }

  // --- Prayers section ---
  const prayersEl = document.getElementById('prayers-list');
  if (d.prayers && Object.keys(d.prayers).length > 0) {
    document.getElementById('prayers-section').style.display = '';
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    const prayerEntries = Object.entries(d.prayers);
    const prayerMinutes = prayerEntries.map(([, t]) => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    });

    let nextIdx = -1;
    for (let i = 0; i < prayerMinutes.length; i++) {
      if (prayerMinutes[i] > nowMinutes) { nextIdx = i; break; }
    }

    prayersEl.innerHTML = prayerEntries.map(([name, time], i) => {
      let cls = '';
      let icon = '🕌';
      if (i === nextIdx) {
        cls = 'next';
        icon = '⏰';
      } else if (nextIdx === -1 ? true : i < nextIdx) {
        if (prayerMinutes[i] <= nowMinutes) {
          cls = 'past';
          icon = '✅';
        }
      }
      return `<div class="prayer-item ${cls}">
        <div class="prayer-left">
          <span class="prayer-icon">${icon}</span>
          <span class="prayer-name">${escapeHtml(name)}</span>
        </div>
        <span class="prayer-time">${escapeHtml(time)}</span>
      </div>`;
    }).join('');
  } else {
    document.getElementById('prayers-section').style.display = 'none';
  }

  // Update timestamp
  const now2 = new Date();
  document.getElementById('last-updated').textContent =
    'обновлено ' + now2.getHours().toString().padStart(2,'0') + ':' + now2.getMinutes().toString().padStart(2,'0');
}

// ── Load status ────────────────────────────────────────────────────────────
async function loadStatus() {
  try {
    const d = await api('/status');
    applyStatus(d);
  } catch(e) {
    if (e.name !== 'AbortError') {
      showToast('❌ Ошибка загрузки: ' + e.message);
    }
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  const timer = setTimeout(hideLoading, 8000);
  try {
    await loadStatus();
  } catch(e) {
    // already handled
  } finally {
    clearTimeout(timer);
    hideLoading();
  }
  setInterval(loadStatus, 30000);
}

// ── Actions ────────────────────────────────────────────────────────────────
async function callAction(btnEl, service, entity_id, extra = {}) {
  if (btnEl) {
    btnEl.classList.add('pending');
    if (btnEl.classList.contains('light-btn')) btnEl.classList.add('pending');
  }
  try {
    const result = await api('/action', 'POST', { service, entity_id, extra });
    showToast('✅ ' + (result.message || service));
    setTimeout(loadStatus, 1000);
  } catch(e) {
    showToast('❌ ' + e.message);
  } finally {
    if (btnEl) btnEl.classList.remove('pending');
  }
}

// Lights
function toggleLight(entity) {
  const btn = document.getElementById('light-' + sanitizeId(entity));
  const isOn = btn && btn.classList.contains('on');
  const domain = LIGHTS_DOMAIN[entity] || 'switch';
  const service = domain + '.' + (isOn ? 'turn_off' : 'turn_on');
  callAction(btn, service, entity);
}

// Climate
function climateAction(onOff) {
  const btns = document.querySelectorAll('.climate-controls .btn');
  const btn = onOff === 'on' ? btns[0] : btns[1];
  const service = onOff === 'on' ? 'climate.turn_on' : 'climate.turn_off';
  callAction(btn, service, FLOOR_ENTITY);
}

function climateSetpoint(delta) {
  const base = currentSetpoint != null ? currentSetpoint : 38;
  const newVal = base + delta;
  const btns = document.querySelectorAll('.climate-controls .btn');
  const btn = delta > 0 ? btns[2] : btns[3];
  callAction(btn, 'climate.set_temperature', FLOOR_ENTITY, { temperature: newVal });
  currentSetpoint = newVal;
  document.getElementById('clim-setpoint').textContent = newVal.toFixed(0) + ' °C';
}

// TV
const TV_ACTIONS = {
  'on':       { service: 'media_player.turn_on',     extra: {} },
  'off':      { service: 'media_player.turn_off',    extra: {} },
  'vol_up':   { service: 'media_player.volume_up',   extra: {} },
  'vol_down': { service: 'media_player.volume_down', extra: {} },
  'play':     { service: 'media_player.media_play',  extra: {} },
  'pause':    { service: 'media_player.media_pause', extra: {} },
  'stop':     { service: 'media_player.media_stop',  extra: {} },
};

function tvAction(action) {
  const def = TV_ACTIONS[action];
  if (!def) return;
  const btn = event.target.closest('button');
  callAction(btn, def.service, TV_ENTITY, def.extra);
}

function tvMuteToggle() {
  const btn = document.getElementById('tv-mute-btn');
  const newMuted = !tvMuted;
  callAction(btn, 'media_player.volume_mute', TV_ENTITY, { is_volume_muted: newMuted });
  tvMuted = newMuted;
  btn.textContent = newMuted ? '🔇 Включить звук' : '🔇 Mute';
}

// Vacuum
function vacuumAction(service) {
  const btn = event.target.closest('button');
  callAction(btn, service, VACUUM_ENTITY);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }
function sanitizeId(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

// ── Start ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
</script>
