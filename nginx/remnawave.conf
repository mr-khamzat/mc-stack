# Remnawave Panel — panelwin.mooo.com
server {
    listen 80;
    server_name panelwin.mooo.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl http2 proxy_protocol;
    server_name panelwin.mooo.com;

    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;

    ssl_certificate /etc/letsencrypt/live/panelwin.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panelwin.mooo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location = /hub { return 301 /hub/; }
    location ^~ /hub/ {
        proxy_pass http://127.0.0.1:8911/hub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        client_max_body_size 20m;
    }
}

# Remnawave Subscription Page — subwin.mooo.com
server {
    listen 80;
    server_name subwin.mooo.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl http2 proxy_protocol;
    server_name subwin.mooo.com;

    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;

    ssl_certificate /etc/letsencrypt/live/subwin.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subwin.mooo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Hysteria2 subscription endpoint (для Happ / v2rayTun / Hiddify / NekoBox)
    # https://subwin.mooo.com/h/<password>  → base64(hy2://...)
    # https://subwin.mooo.com/p/<password>  → plain hy2://...  (диагностика)
    location ~ ^/(h|p|c)/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Mirror Calls для обхода ISP throttling 212.57.118.126
    # Файлы синхронизируются rsync из /opt/clinika/frontend/public/downloads/
    location /calls/ {
        alias /var/www/calls-mirror/;
        autoindex on;
        autoindex_exact_size off;
        sendfile on;
        tcp_nodelay on;
        tcp_nopush on;
        # Длинный keepalive для больших файлов
        keepalive_timeout 75s;
        # Отдаём как application/octet-stream чтобы скачать а не открыть
        types {
            application/octet-stream exe blockmap;
            application/zip zip;
            application/x-yaml yml;
        }
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
    }
}

# Xray Node — nodawin.mooo.com
# Traffic is routed directly to Xray via nginx stream SNI routing (port 2443)
# See /etc/nginx/stream.d/sni.conf
