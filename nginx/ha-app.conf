# nginx конфиг для HA Home Bot Mini App
# ─────────────────────────────────────────────────────────────────────────────
# Этот файл проксирует /ha-app/* на локальный порт 8766 (ha_bot.py)
#
# Установка:
#   1. Замени YOUR_DOMAIN на свой домен (или IP для локалки)
#   2. Для HTTPS: убедись что SSL сертификат уже настроен
#   3. cp nginx/ha-app.conf /etc/nginx/sites-available/ha-app
#      ln -s /etc/nginx/sites-available/ha-app /etc/nginx/sites-enabled/
#      nginx -t && nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

# Ограничение запросов к API (защита от флуда)
# Зоны объявляются в http{} блоке (nginx.conf), но можно и здесь если включены один раз
limit_req_zone $binary_remote_addr zone=ha_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # ACME challenge для Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Редирект HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL сертификат (Let's Encrypt)
    # Получить: certbot --nginx -d YOUR_DOMAIN
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── SSE endpoint — события реального времени ──────────────────────────────
    # ВАЖНО: этот блок должен быть ДО общего /ha-app блока
    # proxy_read_timeout 3600s — соединение держится открытым час
    # proxy_buffering off — данные сразу идут к клиенту без накопления
    location ^~ /ha-app/api/events {
        proxy_pass         http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        add_header Cache-Control    "no-cache" always;
        add_header X-Accel-Buffering "no"      always;
    }

    # ── Основной блок Mini App ─────────────────────────────────────────────────
    location ^~ /ha-app {
        limit_req zone=ha_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
        client_max_body_size 20m;

        # X-Frame-Options НЕ устанавливаем — нужен для Telegram WebApp
        add_header Cache-Control "no-cache" always;
    }

    # ── Опционально: корневой редирект на Mini App ─────────────────────────────
    # Раскомментируй если хочешь чтобы / открывало сразу Mini App:
    # location = / {
    #     return 302 /ha-app/;
    # }
}


